name: Cloudinary to Cloudflare R2 Migration

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of files to migrate (leave empty for ALL)'
        required: false
        default: ''

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run Cloud-to-Cloud Migration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres.iibsizcsglzokdhsfyei:Music123%23%2446hub@aws-0-eu-west-1.pooler.supabase.com:6543/postgres' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'b2e5411830e116cf4ce6e91e90843db0' }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || 'rehearsalhub-media' }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || '53609880149dce49393f0d762b8b4baf' }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || 'dfec6c0153c47aa9c036d9e8bbbe2739ec738352f55afa2f8fd70df95f67ae90' }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL || 'https://pub-cb7697578fcc48d3b3aeb70a47eb2f65.r2.dev' }}
        run: |
          node scripts/scan-all-media.js
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            node scripts/migrate-cloudinary-to-r2.js --live --limit=${{ github.event.inputs.limit }}
          else
            node scripts/migrate-cloudinary-to-r2.js --live
          fi
