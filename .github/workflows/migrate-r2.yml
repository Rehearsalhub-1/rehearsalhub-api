name: Cloudinary to Cloudflare R2 Migration

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of files to migrate (leave empty for ALL)'
        required: false
        default: ''

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run Cloud-to-Cloud Migration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          node scripts/scan-all-media.js
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            node scripts/migrate-cloudinary-to-r2.js --live --limit=${{ github.event.inputs.limit }}
          else
            node scripts/migrate-cloudinary-to-r2.js --live
          fi
